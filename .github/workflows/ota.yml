name: OTA scraper
on:
  workflow_dispatch:
  push:
    paths: ['web/engine.js']
permissions:
  contents: write
jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i esbuild --no-save
      - run: node tools/make-ota.js "update $(date +%F)"
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add ota
          git commit -m "ota" || echo "no changes"
          git push