name: Build APK
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle -p android assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: Nimiyo-Nexora-apk, path: android/app/build/outputs/apk/release/*.apk }
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i esbuild --no-save && node tools/make-ota.js "build otomatis"
      - uses: actions/upload-artifact@v4
        with: { name: ota-scrapers, path: ota/ }
